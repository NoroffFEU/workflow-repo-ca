<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login | Holidaze Venue Booking</title>
    <link rel="stylesheet" href="/css/style.css" />
  </head>

  <body class="bg-gray-100">
    <header class="bg-green-800 text-white py-4">
      <nav id="menu-container" class="container mx-auto px-6"></nav>
    </header>

    <main class="container mx-auto mt-8 px-4 flex-grow">
      <section class="max-w-md mx-auto">
        <h1 class="text-3xl font-bold mb-4 text-gray-800">Login</h1>

        <form id="loginForm" class="bg-white shadow-md rounded-lg p-8" novalidate>
          <fieldset>
            <div class="mb-4">
              <label for="email" class="block mb-1">Email</label>
              <input
                id="email"
                name="email"
                type="email"
                required
                class="w-full px-3 py-2 border border-gray-300 rounded-md"
              />
            </div>
            <div class="mb-6">
              <label for="password" class="block mb-1">Password</label>
              <input
                id="password"
                name="password"
                type="password"
                required
                minlength="8"
                class="w-full px-3 py-2 border border-gray-300 rounded-md"
              />
            </div>
            <button
              type="submit"
              class="w-full bg-blue-500 text-white py-2 px-4 rounded-md hover:bg-blue-600 transition duration-200"
            >
              Log in
            </button>
          </fieldset>
        </form>

        <p data-testid="welcome" class="hidden mt-4 text-green-600"></p>
        <p role="alert" data-testid="login-error" class="hidden mt-4 text-red-600"></p>
      </section>
    </main>

    <script type="module" src="/js/main.js"></script>
    <script type="module" src="/js/pages/login.js"></script>
  </body>
</html>
